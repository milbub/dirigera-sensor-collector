[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dirigera-sensor-collector"
version = "0.1.0"
description = "Collect IKEA environment sensor readings from a DIRIGERA hub into InfluxDB and schedule ALPSTUGA displays."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["ikea", "dirigera", "alpstuga", "timmerflote", "influxdb", "sensors"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Home Automation",
]
# Exact versions are pinned in requirements.txt (single source of truth).
dynamic = ["dependencies"]

[project.scripts]
dirigera-sensor-collector = "dirigera_sensor_collector.service:main"
alpstuga-display = "dirigera_sensor_collector.display_cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
